

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe | Travail+</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">
</head>
<body class="auth-page">
<main class="auth-container">
    <section class="auth-presentation">
        <a href="index.html" class="logo auth-logo">Travail<span>+</span></a>
        <div class="presentation-content">
            <span class="section-label">RÉCUPÉRATION DU COMPTE</span>
            <h1>Choisis un <span>nouveau mot de passe.</span></h1>
            <p>Ton lien est valable pendant une heure. Utilise un mot de passe
                d'au moins six caractères.</p>
        </div>
        <div class="auth-footer-text">© 2026 Travail+ — Tous droits réservés.</div>
    </section>
    <section class="auth-form-section">
        <div class="auth-card">
            <div class="auth-header">
                <div class="mobile-logo">
                    <a href="index.html" class="logo">Travail<span>+</span></a>
                </div>
                <h2>Nouveau mot de passe</h2>
                <p>Protège à nouveau ton compte</p>
            </div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="resetPassword">Nouveau mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-icons">lock</span>
                        <input type="password" id="resetPassword"
                               autocomplete="new-password" minlength="6"
                               required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="resetPasswordConfirmation">Confirmer le mot de passe</label>
                    <div class="input-wrapper">
                        <span class="material-icons">lock</span>
                        <input type="password" id="resetPasswordConfirmation"
                               autocomplete="new-password" minlength="6"
                               required>
                    </div>
                </div>
                <div id="resetMessage" class="login-message"
                     role="alert" aria-live="polite"></div>
                <button type="submit" class="auth-submit" id="resetButton">
                    <span>Modifier le mot de passe</span>
                    <span class="material-icons">check</span>
                </button>
            </form>
            <div class="register-link">
                <a href="login.html">Retour à la connexion</a>
            </div>
        </div>
    </section>
</main>
<script src="reset-password.js"></script>
</body>
</html>
